name: Undeploy DocsPress from fkadev.blog

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Trash the listed DocsPress-managed pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trash DocsPress-managed pages
        env:
          EXECUTE: ${{ inputs.execute }}
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const baseUrl = "https://public-api.wordpress.com/wp/v2/sites/fkadev.blog/pages";
          const execute = process.env.EXECUTE === "true";
          const token = process.env.WP_ACCESS_TOKEN;

          if (!token) {
            throw new Error("WP_ACCESS_TOKEN is unavailable.");
          }

          async function request(url, init = {}) {
            const response = await fetch(url, {
              ...init,
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${token}`,
                ...(init.headers || {})
              }
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : null;

            if (!response.ok) {
              throw new Error(data?.message || `${init.method || "GET"} ${url} failed with HTTP ${response.status}`);
            }

            return { data, headers: response.headers };
          }

          function sentinelFor(page) {
            const content = typeof page.content === "string"
              ? page.content
              : page.content?.raw || page.content?.rendered || "";
            const match = content.match(/<!--\s*docspress:(\{.*?\})\s*-->/s);

            if (!match) {
              return null;
            }

            try {
              return JSON.parse(match[1]);
            } catch {
              return null;
            }
          }

          async function main() {
            const pages = [];
            let pageNumber = 1;
            let totalPages = 1;

            do {
              const url = new URL(baseUrl);
              url.searchParams.set("context", "edit");
              url.searchParams.set("status", "any");
              url.searchParams.set("per_page", "100");
              url.searchParams.set("page", String(pageNumber));
              const response = await request(url);
              pages.push(...response.data);
              totalPages = Number(response.headers.get("x-wp-totalpages") || 1);
              pageNumber += 1;
            } while (pageNumber <= totalPages);

            const managed = pages
              .map((page) => ({ page, sentinel: sentinelFor(page) }))
              .filter(({ sentinel }) => sentinel?.key === "docs" || sentinel?.key?.startsWith("docs/"))
              .sort((left, right) => right.sentinel.key.split("/").length - left.sentinel.key.split("/").length);

            const action = execute ? "Trashing" : "Would trash";
            for (const { page, sentinel } of managed) {
              console.log(`${action} ${sentinel.key} (page ${page.id ?? page.ID})`);
            }

            if (execute) {
              for (const { page } of managed) {
                await request(`${baseUrl}/${page.id ?? page.ID}`, { method: "DELETE" });
              }
            }

            const summary = [
              "## fkadev.blog undeploy",
              "",
              `- Mode: ${execute ? "execute" : "dry run"}`,
              `- DocsPress-managed pages: ${managed.length}`,
              `- Result: ${execute ? "moved to Trash" : "no changes"}`
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
